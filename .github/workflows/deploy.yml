name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Rebuild every 6 hours so the News page keeps showing the last 24 hours of stories:
  # 00:17, 06:17, 12:17 and 18:17 UTC (06:17, 12:17, 18:17 and 00:17 in Dhaka). Off the top of
  # the hour, when GitHub's scheduler is busiest and runs start late.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      # Fetches the News page data. If Hacker News can't be reached, this fails and nothing is
      # deployed, so the last good version of the site stays live.
      - run: npm run news
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4